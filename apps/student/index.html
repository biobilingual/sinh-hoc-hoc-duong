<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BioBilingual - Sinh học song ngữ</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#fffdf0,#eaf2a4);font-family:Arial,sans-serif;color:#475569}
  #bio-loading{font-weight:700}
</style>
</head>
<body>
<div id="bio-loading">Đang tải BioBilingual…</div>
<script>
(async()=>{
  const loading=document.getElementById('bio-loading');
  try{
    const stable='https://raw.githubusercontent.com/biobilingual/sinh-hoc-hoc-duong/7cbba63bd9959d3a3acdf1448a9c3caaf6e6720a/apps/student/index.html';
    const response=await fetch(stable,{cache:'no-store'});
    if(!response.ok)throw new Error('Không tải được giao diện học sinh.');
    let html=await response.text();
    const historyScript='<script src="https://biobilingual.github.io/sinh-hoc-hoc-duong/apps/student/history.js"><\/script>';
    if(html.includes('</body>')) html=html.replace('</body>',historyScript+'</body>');
    else html+=historyScript;
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    loading.textContent='Không thể tải BioBilingual: '+(error?.message||error);
    loading.style.color='#be123c';
  }
})();
</script>
</body>
</html>
