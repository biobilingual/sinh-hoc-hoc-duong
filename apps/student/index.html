<script>
(function(){
  const api='https://rglsppkyxubpmbebdobe.supabase.co/functions/v1/biobilingual-api/api/state';
  const keys=['bioedu_site_content','bioedu_media_library','bioedu_mindmap','bioedu_theory_files','bioedu_entertainment','bioedu_vocab_bank','bioedu_materials_library','bioedu_exam_bank','bioedu_exams','bioedu_course_structure','bioedu_vocab_audio'];
  const nativeSet=Storage.prototype.setItem;
  const nativeGet=Storage.prototype.getItem;
  const emit=(key,value)=>{ try{ window.dispatchEvent(new StorageEvent('storage',{key,newValue:value,storageArea:localStorage,url:location.href})); } catch(e){ window.dispatchEvent(new Event('bioedu-shared-update')); } };
  const read=async key=>{ const r=await fetch(api+'?key='+encodeURIComponent(key),{cache:'no-store'}); if(!r.ok) throw new Error('shared state read failed'); return (await r.json()).value; };
  const write=async (key,raw)=>{ let value=raw; try{ value=JSON.parse(raw); }catch(e){} const r=await fetch(api+'?key='+encodeURIComponent(key),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({key,value})}); if(!r.ok) throw new Error('shared state write failed'); return r.json(); };
  const hydrate=async()=>{ await Promise.all(keys.map(async key=>{ try{ const value=await read(key); if(value!==null&&value!==undefined){ const raw=JSON.stringify(value); nativeSet.call(localStorage,key,raw); emit(key,raw); } }catch(e){} })); };
  Storage.prototype.setItem=function(key,value){ nativeSet.call(this,key,value); };
  window.BioShared={api,read,write,refresh:hydrate};
  hydrate(); setInterval(hydrate,10000);
})();
</script>

  { id: 4, question: "Trong tế bào thực vật, quang hợp diễn ra ở đâu?", options: ["Ti thể", "Không bào", "Lục lạp", "Nhân tế bào"], answer: 2 },
  { id: 5, question: "Thành tế bào nấm được cấu tạo chủ yếu từ chất nào?", options: ["Cellulose", "Peptidoglycan", "Kitin", "Phospholipid"], answer: 2 },
  { id: 6, question: "Một chu kỳ xoắn của phân tử ADN dạng B dài bao nhiêu?", options: ["3,4 Å", "34 Å", "20 Å", "3.4 nm"], answer: 1 },
  { id: 7, question: "Loại ARN nào mang bộ ba đối mã (anticodon)?", options: ["mARN", "tARN", "rARN", "snARN"], answer: 1 },
  { id: 8, question: "Quá trình nhân đôi ADN diễn ra theo nguyên tắc nào?", options: ["Bổ sung và bán bảo toàn", "Bổ sung và bảo toàn", "Bán bảo toàn và gián đoạn", "Bổ sung và liên tục"], answer: 0 },
  { id: 9, question: "Hô hấp tế bào gồm mấy giai đoạn chính?", options: ["2 giai đoạn", "3 giai đoạn", "4 giai đoạn", "5 giai đoạn"], answer: 1 },
  { id: 10, question: "Màng sinh chất có cấu trúc theo mô hình nào?", options: ["Màng kép", "Khảm động", "Lưới nội chất", "Bán thấm"], answer: 1 }
];

const VocabSystem = ({ selectedPath, onPathChange, initialGrade = '10' }) => {
  const [step, setStep] = useState('config'); // config, study, results
  const [adminVocabSets, setAdminVocabSets] = useState(() => { try { return JSON.parse(localStorage.getItem('bioedu_vocab_bank') || '[]'); } catch { return []; } });
  useEffect(() => {
    const sync = () => { try { setAdminVocabSets(JSON.parse(localStorage.getItem('bioedu_vocab_bank') || '[]')); } catch {} };
    window.addEventListener('storage', sync); window.addEventListener('bioedu-shared-update', sync);
    return () => { window.removeEventListener('storage', sync); window.removeEventListener('bioedu-shared-update', sync); };
  }, []);
  useEffect(() => {
    const goBack = () => { if (step !== 'config') setStep('config'); };
    window.addEventListener('bioedu-local-back', goBack);
    return () => window.removeEventListener('bioedu-local-back', goBack);
  }, [step]);
  const allLessonList = Array.from(new Set([...Object.keys(lessonVocabData), ...adminVocabSets.map(item => item.lesson).filter(Boolean)]));
  const lessonsForGrade = (grade) => allLessonList.filter(lesson => {
    const context = findLessonContext(lesson);
    return context ? context.grade === grade : adminVocabSets.some(item => String(item.grade) === String(grade) && item.lesson === lesson);
  });
  const wordsForLesson = (lesson) => {
    const base = lessonVocabData[lesson] ? [...lessonVocabData[lesson]] : [];
    const uploaded = adminVocabSets.filter(item => item.lesson === lesson).flatMap(item => (item.terms || []).map((word, index) => ({ id: `admin-${item.id}-${index}`, term: word.term || word.word || '', def: word.meaning || word.definition || '', meaning: word.meaning || word.definition || '', pronunciation: word.pronunciation || '', pos: word.pos || word.partOfSpeech || '', image: word.image || '', status: 'chưa thuộc' })));
    return [...base, ...uploaded].filter(word => word.term);
  };
  const selectedPathContext = selectedPath?.lesson ? findLessonContext(selectedPath.lesson) : null;
  const [selectedVocabGrade, setSelectedVocabGrade] = useState(selectedPathContext?.grade || initialGrade);
  const [selectedLesson, setSelectedLesson] = useState(selectedPath?.lesson || lessonsForGrade(selectedPathContext?.grade || initialGrade)[0] || '');
  const selectedLessonContext = selectedLesson ? findLessonContext(selectedLesson) : null;
  const activeVocabChapter = selectedLessonContext ? (courseData[selectedLessonContext.grade] || []).find(chapter => chapter.id === selectedLessonContext.chapterId) : null;
  const lessonList = activeVocabChapter ? activeVocabChapter.lessons : lessonsForGrade(selectedVocabGrade);
  const lessonScrollerRef = useRef(null);
  const [lessonScroll, setLessonScroll] = useState({ left: 0, thumb: 100 });
  const syncLessonScroll = () => {
    const element = lessonScrollerRef.current;
    if (!element) return;
    const maxScroll = element.scrollWidth - element.clientWidth;
    if (maxScroll <= 0) { setLessonScroll({ left: 0, thumb: 100 }); return; }
    const thumb = Math.max(24, (element.clientWidth / element.scrollWidth) * 100);
    const left = (element.scrollLeft / maxScroll) * (100 - thumb);
    setLessonScroll({ left, thumb });
  };
  const jumpLessonScroll = (event) => {
    const element = lessonScrollerRef.current;
    if (!element) return;
    const bounds = event.currentTarget.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width));
    element.scrollTo({ left: ratio * (element.scrollWidth - element.clientWidth), behavior: 'smooth' });
  };

  useEffect(() => {
    if (!selectedPath?.lesson) return;
    const context = findLessonContext(selectedPath.lesson);
    if (context) setSelectedVocabGrade(context.grade);
    setSelectedLesson(selectedPath.lesson);
  }, [selectedPath]);

  useEffect(() => {
    if (selectedPath?.lesson) return;
    const lessons = lessonsForGrade(initialGrade);
    setSelectedVocabGrade(initialGrade);
    setSelectedLesson(lessons[0] || '');
  }, [initialGrade]);

  useEffect(() => {
    const refresh = () => window.requestAnimationFrame(syncLessonScroll);
    refresh();
    window.addEventListener('resize', refresh);
    return () => window.removeEventListener('resize', refresh);
  }, [lessonList.length, selectedLesson]);

  const handleVocabGradeChange = (grade) => {
    const lessons = lessonsForGrade(grade);
    setSelectedVocabGrade(grade);
    setSelectedLesson(lessons[0] || '');
    setStep('config');
    setListSearch('');
    setListFilter('all');
  };
  
  const [filterStatus, setFilterStatus] = useState('all'); 
  const [studyOrder, setStudyOrder] = useState('sequential'); 
  const [studyMode, setStudyMode] = useState('flashcard'); 
  const [studyBatchSize, setStudyBatchSize] = useState('all'); 
  
  const [currentWordList, setCurrentWordList] = useState([]);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [score, setScore] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);
  const [quizOptions, setQuizOptions] = useState([]);
  const [typeInput, setTypeInput] = useState('');
  const [timeLeft, setTimeLeft] = useState(20);
  const [showTranslations, setShowTranslations] = useState(false);
  const [hintCount, setHintCount] = useState(0);
  const [listeningResult, setListeningResult] = useState(null);
  const [selectedMatch, setSelectedMatch] = useState(null);
  const [matchNotice, setMatchNotice] = useState('');
  const [listSearch, setListSearch] = useState('');
  const [listFilter, setListFilter] = useState('all');
  const [statusOverrides, setStatusOverrides] = useState({});

  const getWordStatus = (word) => statusOverrides[word.id] || word.status;
  const toggleWordStatus = (word) => {
    setStatusOverrides(prev => ({ ...prev, [word.id]: getWordStatus(word) === 'thuộc' ? 'chưa thuộc' : 'thuộc' }));
  };
  const speakWord = (text, wordId) => {
    try {
      const savedAudio = JSON.parse(localStorage.getItem('bioedu_vocab_audio') || '{}');
      const source = savedAudio[wordId] || savedAudio[text];
      if (source) { const audio = new Audio(source); audio.play(); return; }
    } catch (e) {}
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.92;
      utterance.pitch = 1;
      const voices = window.speechSynthesis.getVoices();
      const usVoice = voices.find(voice => /^en-US$/i.test(voice.lang)) || voices.find(voice => /^en[-_]US/i.test(voice.lang));
      if (usVoice) utterance.voice = usVoice;
      window.speechSynthesis.speak(utterance);
    }
  };

  const startStudy = () => {
    let words = wordsForLesson(selectedLesson);
    if (filterStatus === 'memorized') words = words.filter(w => getWordStatus(w) === 'thuộc');
    if (filterStatus === 'unmemorized') words = words.filter(w => getWordStatus(w) === 'chưa thuộc');
    if (studyOrder === 'random') words = words.sort(() => Math.random() - 0.5);
    if (studyBatchSize !== 'all') words = words.slice(0, Number(studyBatchSize));
    
    if (words.length === 0) {
      setCurrentWordList([]); // Show error state gracefully
      setStep('study');
      return;
    }
    
    setCurrentWordList(words);
    setCurrentIndex(0);
    setScore(0);
    setStep('study');
    if(words.length > 0) generateQuizOptions(words[0], words);
  };

  const generateQuizOptions = (correctWord, allWords) => {
    let options = [correctWord.def];
    let pool = [...allWords].filter(w => w.id !== correctWord.id);
    pool = pool.sort(() => Math.random() - 0.5);
    for(let i=0; i<3 && i<pool.length; i++){ options.push(pool[i].def); }
    options = options.sort(() => Math.random() - 0.5);
    setQuizOptions(options);
  };

  useEffect(() => {
    setTimeLeft(20);
    const effectiveMode = studyMode === 'special' ? ['flashcard','quiz','listening','typing','match'][currentIndex % 5] : studyMode;
    if (step !== 'study' || listeningResult !== null || !['quiz','listening'].includes(effectiveMode)) return;
    const timer = window.setInterval(() => setTimeLeft(t => {
      if (t <= 1) { window.clearInterval(timer); setTimeout(() => handleNext(false), 0); return 0; }
      return t - 1;
    }), 1000);
    return () => window.clearInterval(timer);
  }, [step, studyMode, currentIndex, listeningResult]);

  useEffect(() => {
    const effectiveMode = studyMode === 'special' ? ['flashcard','quiz','listening','typing','match'][currentIndex % 5] : studyMode;
    if (step !== 'study' || effectiveMode !== 'flashcard') return;
    const flipOnSpace = (e) => { if (e.code === 'Space' && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) { e.preventDefault(); setIsFlipped(v => !v); } };
    window.addEventListener('keydown', flipOnSpace);
    return () => window.removeEventListener('keydown', flipOnSpace);
  }, [step, studyMode, currentIndex]);

  const handleNext = (isCorrect) => {
    if (isCorrect) setScore(score + 1);
    setIsFlipped(false);
    setTypeInput('');
    setShowTranslations(false);
    setHintCount(0);
    setListeningResult(null);
    setSelectedMatch(null);
    setMatchNotice('');
    if (currentIndex + 1 < currentWordList.length) {
      setCurrentIndex(currentIndex + 1);
      generateQuizOptions(currentWordList[currentIndex + 1], currentWordList);
    } else {
      setStep('results');
    }
  };

  if (step === 'config') {
    const currentWords = wordsForLesson(selectedLesson);
    const studyPoolWords = currentWords.filter(w => {
      const status = getWordStatus(w);
      return filterStatus === 'all' || (filterStatus === 'memorized' && status === 'thuộc') || (filterStatus === 'unmemorized' && status === 'chưa thuộc');
    });
    const plannedStudyCount = studyBatchSize === 'all' ? studyPoolWords.length : Math.min(Number(studyBatchSize), studyPoolWords.length);
    const filteredListWords = currentWords.filter(w => {
      const matchesSearch = `${w.term} ${w.def}`.toLowerCase().includes(listSearch.toLowerCase().trim());
      const status = getWordStatus(w);
      const matchesFilter = listFilter === 'all' || (listFilter === 'memorized' && status === 'thuộc') || (listFilter === 'unmemorized' && status === 'chưa thuộc');
      return matchesSearch && matchesFilter;
    });
    const studyModes = [
      { id: 'flashcard', icon: '☷', vi: 'Flashcard', en: '', color: 'from-indigo-500 to-violet-600' },
      { id: 'quiz', icon: '✓', vi: 'Trắc nghiệm chọn', en: 'Quiz', color: 'from-amber-500 to-orange-500' },
      { id: 'listening', icon: '🎧', vi: 'Nghe', en: 'Listening', color: 'from-sky-500 to-cyan-600' },
      { id: 'typing', icon: 'T', vi: 'Gõ từ', en: 'Typing', color: 'from-green-500 to-emerald-600' },
      { id: 'match', icon: '▦', vi: 'Ghép cặp', en: 'Matching', color: 'from-cyan-500 to-blue-600' },
      { id: 'special', icon: '↗', vi: 'Đặc biệt', en: 'Special', color: 'from-pink-400 to-rose-500' }
    ];
    const selectedStudyMode = studyModes.find(mode => mode.id === studyMode) || studyModes[0];
    
    return (
      <div className="animate-fade-in max-w-5xl mx-auto pb-16">
        
        <div ref={lessonScrollerRef} onScroll={syncLessonScroll} className="lesson-scroller flex overflow-x-auto gap-3 pb-4 mb-2 snap-x scroll-smooth">
          {lessonList.map(lesson => (
            <button
              key={lesson}
              onClick={() => {
                setSelectedLesson(lesson);
                const context = findLessonContext(lesson);
                if (context && onPathChange) onPathChange(context);
              }}
              className={`shrink-0 min-w-[230px] max-w-[360px] px-6 py-4 rounded-2xl font-bold border-2 transition-all duration-300 snap-start ${
                selectedLesson === lesson 
                  ? 'bg-blue-50 text-blue-700 border-blue-500 shadow-md transform scale-[1.02]' 
                  : 'bg-white text-gray-500 border-gray-200 hover:border-blue-300 hover:bg-blue-50'
              }`}
            >
              {lesson}
            </button>
          ))}
          {lessonList.length === 0 && <div className="w-full rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-7 text-center text-slate-500">Các bài trong chương này đang được cập nhật.</div>}
        </div>
        <div className="mb-8 flex items-center gap-3" aria-label="Thanh di chuyển danh sách bài học">
          <span className="shrink-0 text-[11px] font-extrabold uppercase tracking-wider text-slate-400">Trượt để xem bài</span>
          <div role="scrollbar" aria-label="Di chuyển danh sách bài học" aria-valuenow={Math.round(lessonScroll.left)} onClick={jumpLessonScroll} className="relative h-2.5 flex-1 cursor-pointer rounded-full bg-slate-200/90 shadow-inner">
            <div className="absolute top-0 h-full rounded-full bg-gradient-to-r from-blue-500 to-indigo-500 shadow-sm transition-[left,width] duration-200" style={{ left: `${lessonScroll.left}%`, width: `${lessonScroll.thumb}%` }}></div>
          </div>
          <span className="shrink-0 text-sm font-extrabold text-blue-500">→</span>
        </div>

        <div className="bg-white rounded-[1.75rem] shadow-sm border border-slate-200 mb-10 overflow-hidden">
          <div className="flex flex-col gap-4 p-5 md:p-6 border-b border-slate-100 bg-gradient-to-r from-white to-slate-50">
            <div className="flex items-center justify-between gap-4 flex-wrap">
              <h3 className="text-2xl font-extrabold text-slate-900 flex items-center gap-3">
                <span className="text-xl">⚙️</span>
                Tùy chỉnh / Settings
              </h3>
              <span className="inline-flex items-center rounded-full bg-emerald-500 text-white px-5 py-2.5 text-xl font-extrabold shadow-sm">
                {plannedStudyCount}/{currentWords.length} từ
              </span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
              <div>
                <label className="block text-sm font-bold tracking-wide text-slate-500 uppercase mb-2">Trạng thái</label>
                <div className="relative">
                  <select
                    className="w-full h-16 pl-14 pr-12 rounded-2xl border-2 border-stone-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-400 transition-all appearance-none text-slate-800 font-bold text-xl"
                    value={filterStatus}
                    onChange={(e) => setFilterStatus(e.target.value)}
                  >
                    <option value="all">Tất cả từ vựng</option>
                    <option value="memorized">Đã thuộc</option>
                    <option value="unmemorized">Chưa thuộc</option>
                  </select>
                  <span className="pointer-events-none absolute left-5 top-1/2 -translate-y-1/2 text-2xl">📖</span>
                  <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-slate-400 text-xl">▼</div>
                </div>
              </div>

              <div>
                <label className="block text-sm font-bold tracking-wide text-slate-500 uppercase mb-2">Số lượng</label>
                <div className="relative">
                  <select
                    className="w-full h-16 pl-14 pr-12 rounded-2xl border-2 border-stone-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-400 transition-all appearance-none text-slate-800 font-bold text-xl"
                    value={studyBatchSize}
                    onChange={(e) => setStudyBatchSize(e.target.value)}
                  >
                    <option value="10">10 từ</option>
                    <option value="20">20 từ</option>
                    <option value="50">50 từ</option>
                    <option value="all">Toàn bộ</option>
                  </select>
                  <span className="pointer-events-none absolute left-5 top-1/2 -translate-y-1/2 text-2xl">🔢</span>
                  <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-slate-400 text-xl">▼</div>
                </div>
              </div>

              <div>
                <label className="block text-sm font-bold tracking-wide text-slate-500 uppercase mb-2">Thứ tự</label>
                <div className="relative">
                  <select
                    className="w-full h-16 pl-14 pr-12 rounded-2xl border-2 border-stone-200 bg-white focus:outline-none focus:ring-4 focus:ring-blue-50 focus:border-blue-400 transition-all appearance-none text-slate-800 font-bold text-xl"
                    value={studyOrder}
                    onChange={(e) => setStudyOrder(e.target.value)}
                  >
                    <option value="sequential">Theo thứ tự bài học</option>
                    <option value="random">Ngẫu nhiên</option>
                  </select>
                  <span className="pointer-events-none absolute left-5 top-1/2 -translate-y-1/2 text-2xl">🔀</span>
                  <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-5 text-slate-400 text-xl">▼</div>
                </div>
              </div>
            </div>
          </div>

          <div className="p-5 md:p-6">
            <div className="flex flex-col gap-5">
              <div className="flex items-center justify-between gap-3">
                <h4 className="text-lg md:text-xl font-extrabold text-slate-900">Chọn chế độ học <span className="block text-slate-500 text-base md:text-lg">Choose a learning mode</span></h4>
                <div className="hidden sm:inline-flex items-center gap-2 rounded-full bg-blue-50 border border-blue-200 px-4 py-2 text-blue-700 font-bold"><span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span>Đang chọn</div>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
                {studyModes.map(mode => (
                  <button
                    key={mode.id}
                    onClick={() => setStudyMode(mode.id)}
                    aria-pressed={studyMode === mode.id}
                    className={`relative overflow-hidden min-h-[168px] rounded-[1.4rem] p-4 text-white text-left shadow-md transition-all duration-300 bg-gradient-to-br ${mode.color} ${studyMode === mode.id ? 'ring-4 ring-blue-600 ring-offset-2 ring-offset-white scale-[1.02] shadow-xl' : 'opacity-80 hover:opacity-100 hover:-translate-y-1 hover:shadow-lg'}`}
                  >
                    <div className="absolute top-0 right-0 w-16 h-16 rounded-full bg-white/10"></div>
                    {studyMode === mode.id && <span className="absolute left-3 top-3 rounded-full bg-white text-blue-700 px-2.5 py-1 text-xs font-extrabold shadow-sm">✓ Đang chọn</span>}
                    <div className="relative flex h-full min-h-[136px] flex-col items-center justify-center">
                      <span className={`w-14 h-14 rounded-full bg-white/15 border border-white/25 shadow-inner flex items-center justify-center text-3xl font-bold ${studyMode === mode.id ? 'mt-6' : ''}`}>{mode.icon}</span>
                      <div className="mt-3 text-center font-extrabold text-xl md:text-[1.25rem] leading-tight">{mode.vi}</div>
                      {mode.en && <div className="mt-1 text-center text-base md:text-lg font-bold leading-tight text-white/90">{mode.en}</div>}
                    </div>
                  </button>
                ))}
              </div>

              <div className="flex items-center justify-between gap-4 rounded-2xl border-2 border-blue-200 bg-blue-50 px-4 py-3">
                <div className="flex items-center gap-3 min-w-0"><span className="w-10 h-10 shrink-0 rounded-xl bg-blue-600 text-white flex items-center justify-center text-xl font-extrabold">{selectedStudyMode.icon}</span><p className="font-bold text-slate-800 truncate"><span className="text-blue-700">Đã chọn: </span>{selectedStudyMode.vi}{selectedStudyMode.en ? ` / ${selectedStudyMode.en}` : ''}</p></div>
                <span className="hidden sm:block text-sm font-semibold text-blue-700 whitespace-nowrap">Sẵn sàng bắt đầu</span>
              </div>

              <button
                onClick={startStudy}
                className="w-full md:w-auto md:min-w-[220px] self-end bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-6 py-3 rounded-xl font-bold text-base shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300 flex justify-center items-center gap-3"
              >
                Bắt đầu học ngay / Start learning 🚀
              </button>
            </div>
          </div>
        </div>

        <section className="bg-white rounded-[1.75rem] border border-gray-200 shadow-sm overflow-hidden">
          <div className="px-5 md:px-7 pt-6 pb-5">
            <div className="flex items-center justify-between gap-4 mb-6">
              <h3 className="text-2xl md:text-3xl font-extrabold text-gray-900">Danh sách từ vựng</h3>
              <span className="text-sm md:text-base text-slate-500">{filteredListWords.length} / {currentWords.length} từ</span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-[1fr_240px] gap-4">
              <div className="relative">
                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">⌕</span>
                <input
                  value={listSearch}
                  onChange={(e) => setListSearch(e.target.value)}
                  placeholder="Tìm kiếm từ vựng..."
                  className="w-full h-12 pl-12 pr-4 rounded-2xl border-2 border-slate-200 bg-white text-slate-700 placeholder:text-slate-400 focus:outline-none focus:border-blue-400 focus:ring-4 focus:ring-blue-50 transition"
                />
              </div>
              <select
                value={listFilter}
                onChange={(e) => setListFilter(e.target.value)}
                className="h-12 px-4 rounded-2xl border-2 border-slate-200 bg-white text-slate-700 focus:outline-none focus:border-blue-400 cursor-pointer"
              >
                <option value="all">Tất cả</option>
                <option value="memorized">Đã thuộc</option>
                <option value="unmemorized">Chưa thuộc</option>
              </select>
            </div>
          </div>

          <div className="hidden md:grid grid-cols-[1.6fr_1fr_0.65fr_1.35fr_0.45fr] gap-5 px-6 py-4 bg-slate-50 border-y border-slate-200 text-sm font-extrabold tracking-wide text-slate-600">
            <div>TỪ VỰNG</div>
            <div>NGHĨA</div>
            <div>LOẠI TỪ</div>
            <div>VÍ DỤ</div>

        </div>

      <div className="bg-white border border-blue-100 rounded-3xl shadow-sm p-5 md:p-7">

            {!isFlipped ? <div className="min-h-[440px] px-7 py-10 flex flex-col items-center justify-center text-white"><img src={info.image||vocabImage} alt={`Hình minh họa ${info.en}`} className="h-44 w-56 rounded-3xl object-cover shadow-lg ring-4 ring-white/25" /><h2 className="mt-8 text-4xl md:text-6xl font-extrabold text-slate-950"><span role="button" tabIndex="0" onClick={(e)=>{e.stopPropagation();speakWord(info.en,word.id)}} onKeyDown={(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();speakWord(info.en,word.id)}}} className="cursor-pointer">{info.en}</span></h2><span className="mt-5 inline-flex px-5 py-2 rounded-full bg-white/30 text-white text-lg font-extrabold uppercase">{info.pos}</span></div> : <div className="min-h-[440px] px-7 py-10 flex flex-col items-center justify-center text-white"><p className="text-sm font-extrabold tracking-[0.16em] uppercase text-white/80">Nghĩa</p><p className="mt-4 max-w-3xl text-2xl md:text-4xl font-extrabold leading-tight text-slate-950">{info.meaning}</p><div className="mt-8 grid w-full max-w-2xl gap-4 text-left md:grid-cols-2"><div className="rounded-2xl bg-white/20 p-4"><p className="text-xs font-extrabold uppercase tracking-wider text-white/75">Phiên âm</p><p className="mt-1 text-xl font-bold text-white">{info.pronunciation}</p></div><div className="rounded-2xl bg-white/20 p-4"><p className="text-xs font-extrabold uppercase tracking-wider text-white/75">Nghĩa tiếng Việt</p><p className="mt-1 text-xl font-bold text-white">{info.vi}</p></div></div></div>}
          </button>
          <div className="grid grid-cols-2 gap-3 mt-6"><button onClick={()=>handleNext(false)} className="py-3 rounded-xl border border-rose-200 text-rose-600 font-bold hover:bg-rose-50">Chưa thuộc / Not learned</button><button onClick={()=>handleNext(true)} className="py-3 rounded-xl bg-emerald-600 text-white font-bold hover:bg-emerald-700">Đã thuộc / Learned</button></div>
        </div>}

        {activeMode === 'quiz' && <div className="text-center"><p className="text-sm font-bold text-blue-600 uppercase tracking-wide">Chọn nghĩa đúng</p><h2 className="text-4xl font-extrabold text-slate-900 mt-3 mb-8"><button type="button" onClick={()=>speakWord(info.en,word.id)} className="cursor-pointer hover:text-blue-600" title="Nghe giọng Mỹ / US pronunciation">{info.en}</button></h2><div className="grid md:grid-cols-2 gap-3 text-left">{quizOptions.map((opt,i)=><button key={i} onClick={()=>handleNext(opt===word.def)} className="p-5 rounded-2xl border border-slate-200 font-semibold text-slate-700 hover:border-blue-400 hover:bg-blue-50 transition">{String.fromCharCode(65+i)}. {opt}</button>)}</div></div>}

        {activeMode === 'listening' && <div className="text-center py-5"><p className="text-sm font-bold text-sky-600 uppercase tracking-wide">Nghe và gõ lại từ vựng / Listen & type</p><button onClick={()=>speakWord(info.en, word.id)} className="mx-auto mt-7 w-20 h-20 rounded-full bg-sky-50 text-sky-600 text-3xl border border-sky-100 hover:bg-sky-100" title="Nghe giọng Mỹ / US pronunciation">🔊</button><p className="text-slate-500 mt-4">Nhấn để nghe lại / Listen again</p><input autoFocus value={typeInput} onChange={e=>setTypeInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&setListeningResult(typeInput.trim().toLowerCase()===info.en.toLowerCase())} placeholder="Gõ từ tiếng Anh / Type the English word..." className="w-full max-w-xl mt-8 px-5 py-4 rounded-2xl border-2 border-sky-300 text-center text-xl outline-none focus:border-sky-500"/><button onClick={()=>setListeningResult(typeInput.trim().toLowerCase()===info.en.toLowerCase())} className="mt-5 px-8 py-3 rounded-xl bg-sky-600 text-white font-bold">Kiểm tra / Check</button>{listeningResult !== null && <div className={`max-w-xl mx-auto mt-5 p-4 rounded-xl ${listeningResult?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700'}`}><p className="font-bold">{listeningResult?'Chính xác! / Correct!':'Chưa đúng / Not quite.'}</p><p className="mt-1">Đáp án / Answer: <button type="button" onClick={()=>speakWord(info.en, word.id)} className="font-bold underline decoration-dotted underline-offset-4">{info.en}</button></p><button onClick={()=>handleNext(listeningResult)} className="mt-4 px-5 py-2 rounded-lg bg-white/80 border border-current font-bold">Từ tiếp theo / Next word</button></div>}</div>}

        {activeMode === 'typing' && <div className="text-center py-3"><h2 className="text-2xl md:text-3xl font-extrabold text-slate-900">{word.def}</h2><div className="mt-4 flex justify-center items-center gap-3"><button onClick={()=>speakWord(info.en, word.id)} className="text-sky-500 text-xl" title="Nghe giọng Mỹ / US pronunciation">🔊</button><span className="px-4 py-1.5 rounded-full bg-violet-100 text-violet-700 text-sm font-extrabold uppercase">{info.pos}</span></div><p className="mt-5 italic text-slate-400">{hintCount ? `Gợi ý / Hint: ${info.en.slice(0,hintCount)}${' •'.repeat(Math.max(0,info.en.length-hintCount))}` : 'Chưa có gợi ý / No hint yet'}</p><input autoFocus value={typeInput} onChange={e=>setTypeInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submitTyping()} placeholder="Gõ từ tiếng Anh / Type the English word..." className="w-full max-w-xl mt-9 px-6 py-4 rounded-full border-[3px] border-sky-400 text-center text-xl outline-none focus:ring-4 focus:ring-sky-100"/><div className="flex flex-wrap justify-center gap-3 mt-7"><button disabled={hintCount>=2} onClick={()=>setHintCount(Math.min(2,hintCount+1))} className="px-5 py-3 rounded-xl border border-slate-200 font-bold text-slate-700 disabled:opacity-50">Gợi ý / Hint ({hintCount}/2)</button><button onClick={submitTyping} className="px-8 py-3 rounded-xl bg-green-600 text-white font-extrabold shadow-sm">Kiểm tra / Check</button></div>{hintCount >= 2 && <p className="mt-5 text-slate-500"><strong>Ví dụ / Example:</strong> {info.example} — {info.exampleVi}</p>}</div>}

        {activeMode === 'match' && <div><div className="text-center mb-6"><p className="text-sm font-bold text-cyan-600 uppercase tracking-wide">Ghép cặp</p><h2 className="text-2xl font-extrabold text-slate-900 mt-2">Chọn từ tiếng Anh rồi chọn nghĩa phù hợp</h2></div><div className="grid md:grid-cols-2 gap-4"><div className="space-y-3">{matchWords.map(w=><button key={w.id} onClick={()=>{speakWord(vocabInfo(w).en,w.id);setSelectedMatch(w.id);setMatchNotice('')}} className={`w-full p-4 rounded-xl border text-left font-bold transition ${selectedMatch===w.id?'border-blue-500 bg-blue-50 text-blue-700':'border-slate-200 text-slate-800 hover:border-blue-300'}`}>{vocabInfo(w).en}</button>)}</div><div className="space-y-3">{[...matchWords].sort((a,b)=>b.id-a.id).map(w=><button key={w.id} onClick={()=>chooseMatch(w)} className="w-full p-4 rounded-xl border border-slate-200 text-left text-slate-700 hover:border-cyan-400 hover:bg-cyan-50 transition">{w.def}</button>)}</div></div>{matchNotice&&<p className={`text-center mt-5 font-bold ${matchNotice.startsWith('Chính')?'text-emerald-600':'text-rose-600'}`}>{matchNotice}</p>}</div>}
      </div>
    </div>;
  }

  if (step === 'results') return (
    <div className="bg-white p-10 rounded-2xl shadow-sm border border-blue-100 text-center max-w-lg mx-auto animate-fade-in">
      <div className="text-7xl mb-6">🏆</div>
      <h2 className="text-3xl font-extrabold text-blue-900 mb-3">Hoàn thành!</h2>
      <p className="text-xl text-gray-600 mb-8">Số điểm: <span className="font-bold text-green-600">{score}</span> / {currentWordList.length}</p>
      <button onClick={() => setStep('config')} className="w-full bg-blue-600 text-white px-6 py-4 rounded-xl font-bold hover:bg-blue-700 text-lg shadow-md">Chọn bài khác / Choose another · Học lại / Review</button>
    </div>
  );
};

const sanitizeTheoryHtml = html => { const doc=new DOMParser().parseFromString(html||'','text/html');doc.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(node=>node.remove());doc.querySelectorAll('*').forEach(node=>[...node.attributes].forEach(attribute=>{if(attribute.name.toLowerCase().startsWith('on')||/javascript:/i.test(attribute.value))node.removeAttribute(attribute.name)}));return doc.body.innerHTML; };
const KnowledgeContentPanel = ({ selectedGrade, selectedChapterTitle, selectedLesson }) => {

  useEffect(()=>setSelected(0),[selectedGrade,selectedChapterTitle,selectedLesson]);
  const normalized=value=>String(value||'').toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

  const visible=matches.length?matches:(!selectedLesson?files:[]);

  const pairRight = right => { if (!selectedLeft) return; setMatches(prev => ({ ...prev, [selectedLeft]: right })); setSelectedLeft(null); };
  return <div className="animate-fade-in min-h-screen -mx-5 md:-mx-10 -mt-0 bg-[#effbf4] pb-12">
    <header className="sticky top-0 z-30 border-b border-blue-950/15 bg-[#1f3d8d] px-5 py-4 text-white shadow-md md:px-10"><div className="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4"><div><button onClick={onExit} className="mb-1 text-xs font-bold text-blue-100 hover:text-white">← Back to worksheets</button><h2 className="text-xl font-extrabold md:text-2xl">{data.title || item.title}</h2><p className="mt-1 text-sm font-semibold text-yellow-300">{data.topic || `Biology - Grade ${item.grade}`}</p></div><div className="rounded-full bg-white px-5 py-2.5 text-lg font-extrabold text-[#1f3d8d] shadow-sm">◷ {time}</div></div></header>

    return () => window.removeEventListener('bioedu-local-back', goBack);

    return () => { window.removeEventListener('storage', sync); window.removeEventListener('bioedu-shared-update', sync); };
  }, []);
  const normalizedText = value => String(value || '').toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();

  const uploadedBundles = uploadedExamQuestions.filter(item => Array.isArray(item.questions) && item.questions.length === 14);
  const sameLesson = item => { const uploaded=normalizedText(item.lesson);const selected=normalizedText(practiceLesson);return !selected||uploaded===selected||uploaded.includes(selected)||selected.includes(uploaded); };
  const activeUploadedExam = uploadedBundles.find(item => String(item.grade)===String(practiceGrade)&&sameLesson(item)) || uploadedBundles.find(item => String(item.grade)===String(practiceGrade));
  const availableQuestionBank = activeUploadedExam?.questions?.length ? activeUploadedExam.questions.map((q,index)=>({...q,id:q.id||`admin-${activeUploadedExam.id}-${index}`,group:q.kind==='choice'?'Trắc nghiệm':q.kind==='tf'?'Đúng/Sai':'Trả lời ngắn'})) : adminQuestionBank;
  useEffect(() => { if (state === 'choice' || state === 'theory') setState('browse'); }, [state]);

        <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm"><div className="flex justify-between items-center"><h2 className="text-xl font-extrabold text-slate-900">Hoạt động gần đây / Recent activity</h2><button className="text-sm text-blue-600 font-bold">Tất cả / All</button></div><div className="mt-5 space-y-5">{activities.map(([text, time, icon]) => <div key={text} className="flex gap-3"><span className="w-9 h-9 bg-slate-100 rounded-full flex items-center justify-center shrink-0">{icon}</span><div><p className="text-sm font-semibold text-slate-700 leading-snug">{text}</p><p className="text-xs text-slate-400 mt-1">{time}</p></div></div>)}</div><button onClick={() => onNavigate('ranking')} className="w-full mt-7 py-3 rounded-xl border border-blue-100 bg-blue-50 text-blue-700 font-bold hover:bg-blue-100">Xem bảng xếp hạng / View leaderboard</button></div>
      </div>
    </div>
  );
};

const BioLogo = () => (
  <span className="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br from-emerald-500 via-teal-500 to-blue-600 text-white flex items-center justify-center shadow-md shadow-emerald-200">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" className="w-7 h-7">
      <path d="M14 8c12 4 12 12 20 16s8 12 0 16" />
      <path d="M34 8c-12 4-12 12-20 16s-8 12 0 16" />
      <path d="M17 13h14M14 21h20M14 29h20M17 37h14" />
      <path d="M38 7c3 1 5 4 4 7-1 3-5 5-9 5 0-4 2-8 5-10Z" fill="currentColor" stroke="none" opacity=".9" />
    </svg>
  </span>
);

function App() {
  const [activeTab, setActiveTab] = useState('home');
  const mainRef = useRef(null);
  const [isSidebarOpen, setIsSidebarOpen] = useState(true);
  const googleButtonRef = useRef(null);
  const [googleAuth, setGoogleAuth] = useState(() => readGoogleAuth());
  const [authChecking, setAuthChecking] = useState(true);
  const [authError, setAuthError] = useState('');
  const [profileSaving, setProfileSaving] = useState(false);
  const classOptions = BIO_CLASS_SUBJECTS;
  const emptyStudentProfile = { name: '', email: '', school: '', block: '', className: '' };
  const readStudentProfile = () => {
    try {
      const raw = localStorage.getItem('bioedu_student_profile');
      const saved = raw ? JSON.parse(raw) : null;
      return saved ? { ...saved, email: saved.email || '', block: String(saved.block || saved.grade || ''), className: saved.className || '' } : null;
    } catch { return null; }
  };
  const [studentProfile, setStudentProfile] = useState(() => readStudentProfile());
  const [profileDraft, setProfileDraft] = useState(() => readStudentProfile() || emptyStudentProfile);
  const [profileOpen, setProfileOpen] = useState(false);
  const [siteContent, setSiteContent] = useSiteContent();
  const [selectedHomeGrade, setSelectedHomeGrade] = useState('10');
  const [selectedHomeLesson, setSelectedHomeLesson] = useState(courseData['10'][0].lessons[0]);
  const [showBioFact, setShowBioFact] = useState(false);
  const plantTodayKey = new Date().toLocaleDateString('en-CA');
  const [plantWatered, setPlantWatered] = useState(() => localStorage.getItem('bioedu_plant_watered') === plantTodayKey);
  const [plantAge, setPlantAge] = useState(() => Math.max(7, Number(localStorage.getItem('bioedu_plant_age')) || 7));
  useEffect(() => {
    const storedAuth = readGoogleAuth();
    if (!storedAuth) {
      localStorage.removeItem('bioedu_google_auth');
      setGoogleAuth(null);
      setAuthChecking(false);
      return;
    }
    fetch(`${BIO_SHARED_API}/api/auth/session`, {
      headers: { 'Authorization': `Bearer ${storedAuth.token}` },
      cache: 'no-store'
    }).then(async response => {
      if (!response.ok) throw new Error('Phiên đăng nhập đã hết hạn.');
      const data = await response.json();
      const verifiedAuth = { ...storedAuth, user: data.user || storedAuth.user };
      localStorage.setItem('bioedu_google_auth', JSON.stringify(verifiedAuth));
      setGoogleAuth(verifiedAuth);
      const savedProfile = readStudentProfile();
      if (savedProfile?.email?.toLowerCase() === verifiedAuth.user.email.toLowerCase()) {
        setStudentProfile(savedProfile);
        setProfileDraft(savedProfile);
        setProfileOpen(false);
      } else {
        const nextDraft = { ...emptyStudentProfile, name: verifiedAuth.user.name || '', email: verifiedAuth.user.email };
        setProfileDraft(nextDraft);
        setProfileOpen(true);
      }
    }).catch(error => {
      localStorage.removeItem('bioedu_google_auth');
      setGoogleAuth(null);
      setAuthError(error.message || 'Vui lòng đăng nhập lại bằng Google.');
    }).finally(() => setAuthChecking(false));
  }, []);
  useEffect(() => {
    if (authChecking || googleAuth) return;
    let initialized = false;
    const initializeGoogleButton = () => {
      if (initialized || !window.google?.accounts?.id || !googleButtonRef.current) return;
      initialized = true;
      window.google.accounts.id.initialize({
        client_id: BIO_GOOGLE_CLIENT_ID,
        callback: async response => {
          setAuthError('');
          try {
            const loginResponse = await fetch(`${BIO_SHARED_API}/api/auth/google`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ credential: response.credential })
            });
            const data = await loginResponse.json();
            if (!loginResponse.ok) throw new Error(data.error || 'Đăng nhập Google không thành công.');
            const nextAuth = { token: data.token, user: data.user, expiresAt: data.expiresAt };
            localStorage.setItem('bioedu_google_auth', JSON.stringify(nextAuth));
            setGoogleAuth(nextAuth);
            const savedProfile = readStudentProfile();
            if (savedProfile?.email?.toLowerCase() === data.user.email.toLowerCase()) {
              setStudentProfile(savedProfile);
              setProfileDraft(savedProfile);
              setProfileOpen(false);
            } else {
              const nextDraft = { ...emptyStudentProfile, name: data.user.name || '', email: data.user.email };
              setProfileDraft(nextDraft);
              setProfileOpen(true);
            }
          } catch (error) {
            setAuthError(error.message || 'Không thể đăng nhập bằng Google.');
          }
        }
      });
      googleButtonRef.current.innerHTML = '';
      window.google.accounts.id.renderButton(googleButtonRef.current, {
        theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', logo_alignment: 'left', width: 310
      });
    };
    initializeGoogleButton();
    const timer = window.setInterval(initializeGoogleButton, 250);
    return () => window.clearInterval(timer);
  }, [authChecking, googleAuth]);
  const signOut = () => {
    localStorage.removeItem('bioedu_google_auth');
    window.google?.accounts?.id?.disableAutoSelect?.();
    setGoogleAuth(null);
    setProfileOpen(false);
    setAuthError('');
  };
  const saveStudentProfile = async () => {
    if (!googleAuth?.token || !googleAuth?.user?.email) return;
    const next = {
      name: String(profileDraft.name || '').trim(),
      email: String(googleAuth.user.email).trim().toLowerCase(),
      school: String(profileDraft.school || '').trim(),
      block: String(profileDraft.block || '').trim(),
      className: String(profileDraft.className || '').trim()
    };
    if (!next.name || !next.email || !next.school || !next.block || !next.className) return;
    setProfileSaving(true);
    setAuthError('');
    const studentId = next.email;
    const currentStudents = (() => { try { return JSON.parse(localStorage.getItem('bioedu_students') || '[]'); } catch { return []; } })();
    const existing = currentStudents.find(student => student.id === studentId);
    const studentRecord = { ...next, id: studentId, grade: next.block, createdAt: existing?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
    try {
      const response = await fetch(`${BIO_SHARED_API}/api/student`, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'Authorization': `Bearer ${googleAuth.token}` },
        body: JSON.stringify(studentRecord)
      });
      if (!response.ok) throw new Error('Không thể lưu hồ sơ. Vui lòng thử lại.');
      localStorage.setItem('bioedu_student_id', studentId);
      localStorage.setItem('bioedu_students', JSON.stringify([...currentStudents.filter(student => student.id !== studentId), studentRecord]));
      localStorage.setItem('bioedu_student_profile', JSON.stringify(next));
      setStudentProfile(next);
      setProfileDraft(next);
      setProfileOpen(false);
    } catch (error) {
      setAuthError(error.message || 'Không thể lưu hồ sơ.');
    } finally {
      setProfileSaving(false);
    }
  };
  const scrollMainToTop = () => {
    window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
    if (mainRef.current) mainRef.current.scrollTo({ top: 0, left: 0, behavior: 'auto' });
  };
  const navigateToTab = (nextTab) => {
    if (nextTab === activeTab) { scrollMainToTop(); return; }
    setActiveTab(nextTab);
    window.requestAnimationFrame(scrollMainToTop);
  };
  useEffect(() => {
    const frame = window.requestAnimationFrame(scrollMainToTop);
    return () => window.cancelAnimationFrame(frame);
  }, [activeTab]);
  useEffect(() => {
    const day = new Date().toLocaleDateString('en-CA');
    if (sessionStorage.getItem('bioedu_visit_day') === day) return;
    sessionStorage.setItem('bioedu_visit_day', day);
    fetch(`${BIO_SHARED_API}/api/visit`, { method: 'POST' }).catch(() => {});
  }, []);
  const waterPlantToday = () => {
    if (plantWatered) return;
    const nextAge = plantAge + 1;
    localStorage.setItem('bioedu_plant_watered', plantTodayKey);
    localStorage.setItem('bioedu_plant_age', String(nextAge));
    setPlantAge(nextAge);
    setPlantWatered(true);
  };

  const renderDifficultyBar = (level) => {
    const percentage = (level / 5) * 100;
    let colorClass = 'bg-green-500';
    let textColorClass = 'text-green-600';
    if (level >= 3) { colorClass = 'bg-yellow-400'; textColorClass = 'text-yellow-500'; }
    if (level >= 4) { colorClass = 'bg-orange-500'; textColorClass = 'text-orange-500'; }
    if (level === 5) { colorClass = 'bg-red-500'; textColorClass = 'text-red-500'; }

    return (
      <div className="mt-4">
        <div className="flex justify-between items-center mb-2">
          <span className="text-xs font-bold text-gray-400">ĐỘ KHÓ</span>
          <span className={`text-sm font-bold ${textColorClass}`}>{level}/5</span>
        </div>
        <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
          <div className={`${colorClass} h-full rounded-full transition-all duration-500`} style={{ width: `${percentage}%` }}></div>
        </div>
      </div>
    );
  };

  const renderHome = () => {
    const gradeTabs = ['10', '11', '12'];
    const chapters = courseData[selectedHomeGrade] || [];
    const chapterThemes = [
      { gradient: 'from-blue-500 to-indigo-600', soft: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-700', line: 'bg-blue-500', hover: 'hover:border-blue-300' },
      { gradient: 'from-violet-500 to-fuchsia-600', soft: 'bg-violet-50', border: 'border-violet-200', text: 'text-violet-700', line: 'bg-violet-500', hover: 'hover:border-violet-300' },
      { gradient: 'from-emerald-500 to-teal-600', soft: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-700', line: 'bg-emerald-500', hover: 'hover:border-emerald-300' },
      { gradient: 'from-amber-400 to-orange-500', soft: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-700', line: 'bg-amber-500', hover: 'hover:border-amber-300' }
    ];

    return (
      <div className="p-5 md:p-10 max-w-7xl mx-auto animate-fade-in">
        <section className="mb-10">
          <div className="grid grid-cols-1 lg:grid-cols-[1.25fr_.75fr] gap-5 items-stretch">
            <article className="relative overflow-hidden rounded-[1.5rem] border border-cyan-100 bg-gradient-to-br from-white via-cyan-50 to-blue-100 p-4 md:p-5 shadow-sm lg:h-64">
              <div className="absolute -right-12 -top-14 h-48 w-48 rounded-full border-[26px] border-cyan-300/25"></div><div className="absolute right-24 -bottom-20 h-40 w-40 rounded-full bg-blue-300/15"></div>
              <div className="relative flex h-full flex-col justify-between gap-3">
                <div className="flex items-center gap-3"><div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 text-lg text-white shadow-sm">⌬</div><p className="text-xs font-extrabold uppercase tracking-[0.16em] text-blue-700">{siteContent.home.eyebrow}</p></div>
                <div><h2 className="max-w-xl text-xl md:text-2xl font-extrabold leading-tight text-slate-900">{siteContent.home.title}</h2><p className="mt-1.5 text-sm text-slate-600">{siteContent.home.description}</p></div>
                <div><button onClick={() => setShowBioFact(value => !value)} aria-expanded={showBioFact} className="rounded-xl bg-blue-600 px-3.5 py-2 text-sm font-extrabold text-white shadow-sm transition hover:bg-blue-700">{showBioFact ? siteContent.home.hide : siteContent.home.explore}</button></div>
                {showBioFact && <div className="absolute right-0 bottom-0 hidden w-[46%] rounded-2xl border border-white/80 bg-white/75 p-4 shadow-sm backdrop-blur-sm md:block animate-fade-in"><p className="text-xs font-extrabold uppercase tracking-[0.12em] text-blue-700">{siteContent.home.factTitle}</p><p className="mt-2 text-sm font-semibold leading-relaxed text-slate-700">{siteContent.home.factBody}</p><p className="mt-2 text-xs font-bold text-blue-600">{siteContent.home.factReminder}</p></div>}
                {showBioFact && <div className="mt-1 rounded-2xl border border-white/80 bg-white/75 p-4 shadow-sm backdrop-blur-sm md:hidden animate-fade-in"><p className="text-xs font-extrabold uppercase tracking-[0.12em] text-blue-700">{siteContent.home.factTitle}</p><p className="mt-2 text-sm font-semibold leading-relaxed text-slate-700">{siteContent.home.factBody}</p><p className="mt-2 text-xs font-bold text-blue-600">{siteContent.home.factReminder}</p></div>}
              </div>
            </article>
            <article className="relative overflow-hidden rounded-[1.5rem] border border-emerald-200 bg-gradient-to-br from-emerald-500 via-green-500 to-lime-500 p-4 md:p-5 text-white shadow-sm lg:h-64">
              <div className="absolute -right-10 -top-12 h-40 w-40 rounded-full border-[22px] border-white/15"></div><div className="absolute -left-10 -bottom-12 h-32 w-32 rounded-full bg-yellow-300/20"></div><div className="absolute right-20 bottom-8 text-[7rem] leading-none text-white/[0.08]">♧</div>
              <div className="relative flex h-full flex-col justify-between gap-3">
                <div className="flex items-start justify-between gap-3">
                  <div><p className="mt-1 text-2xl md:text-3xl font-extrabold tracking-tight">Cây {plantAge} ngày tuổi</p></div>
                  <span className={`flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-white/30 bg-white/20 text-2xl shadow-sm transition-transform ${plantWatered ? 'scale-110' : ''}`}>{plantWatered ? '🌿' : '🌱'}</span>
                </div>

                <div className="relative pt-1">
                  <div className="absolute left-4 right-4 top-5 h-1 rounded-full bg-white/25"></div>
                  <div className="relative grid grid-cols-7 gap-1">{['T2','T3','T4','T5','T6','T7','CN'].map((day,index) => <div key={day} className="flex flex-col items-center"><span className={`flex h-9 w-9 items-center justify-center rounded-full border text-sm shadow-sm ${index === 6 ? 'border-lime-100 bg-white text-green-600' : 'border-white/35 bg-emerald-600/35 text-white'}`}>{index === 6 ? (plantWatered ? '🌿' : '💧') : '✓'}</span><span className="mt-1 text-[10px] font-extrabold text-emerald-50">{day}</span></div>)}</div>
                </div>

                <div className="flex items-center gap-2 rounded-xl border border-white/20 bg-white/10 p-2.5">
                  <p className="min-w-0 flex-1 text-sm font-semibold leading-snug">{plantWatered ? siteContent.plant.done : siteContent.plant.encouragement}</p>
                  <button onClick={waterPlantToday} disabled={plantWatered} className={`shrink-0 rounded-xl px-3.5 py-2.5 text-xs font-extrabold shadow-sm transition ${plantWatered ? 'cursor-default bg-white/20 text-white' : 'bg-white text-green-700 hover:-translate-y-0.5 hover:shadow-md'}`}>{plantWatered ? siteContent.plant.wateredButton : siteContent.plant.water}</button>
                </div>
              </div>
            </article>
          </div>
          <div className="mt-10"><h2 className="text-center text-3xl font-extrabold text-slate-900 mb-6">Truy cập nhanh</h2><div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">{siteContent.quickAccess.map(item => <button key={item.tab} onClick={()=>navigateToTab(item.tab)} className={`relative overflow-hidden bg-white border border-slate-200 rounded-[1.35rem] p-4 min-h-[108px] flex items-center gap-3 text-left shadow-sm hover:-translate-y-1 hover:shadow-lg transition-all ${item.edge}`}><span className={`absolute -right-7 -top-7 w-24 h-24 rounded-full opacity-40 ${item.tone.split(' ')[0]}`}></span><span className={`relative w-12 h-12 rounded-xl flex items-center justify-center text-3xl font-bold shadow-sm ${item.tone}`}>{item.icon}</span><span className="relative flex-1"><span className="block whitespace-nowrap text-base font-extrabold text-slate-900 leading-tight">{item.label.split(' / ')[0]}</span><span className="block whitespace-nowrap text-sm font-bold text-slate-500 leading-tight mt-1">{item.label.split(' / ')[1] || ''}</span></span><span className="relative text-2xl text-slate-300">→</span></button>)}</div></div>
        </section>

        <div className="text-center mb-6">
          <p className="inline-flex items-center px-7 py-2.5 rounded-full bg-blue-600 text-xl md:text-2xl font-extrabold uppercase tracking-[0.22em] text-white shadow-lg shadow-blue-200 mb-5">THPT</p>
          <div className="flex justify-center gap-3 flex-wrap">
          {gradeTabs.map((grade) => (
            <button
              key={grade}
              onClick={() => {
                setSelectedHomeGrade(grade);
                const firstChapter = (courseData[grade] || [])[0];
                if (firstChapter?.lessons?.[0]) {
                  setSelectedHomeLesson(firstChapter.lessons[0]);
                }
              }}
            className={`px-7 py-3 rounded-2xl font-extrabold border transition-all ${selectedHomeGrade === grade ? 'bg-slate-900 text-white border-slate-900 shadow-md scale-[1.03]' : 'bg-white text-slate-600 border-slate-200 hover:border-blue-300 hover:text-blue-700'}`}
            >
              Lớp {grade} / Grade {grade}
            </button>
          ))}
          </div>
        </div>

        <div className="mb-6 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
          <div><p className="text-xs font-extrabold tracking-[0.15em] uppercase text-blue-600">Lộ trình học</p><h2 className="text-3xl md:text-4xl font-extrabold text-slate-900 mt-1">Sinh học lớp {selectedHomeGrade}</h2><p className="mt-1.5 text-slate-500">Chọn bài học để bắt đầu ôn tập từ vựng.</p></div>
          <div className="flex items-center gap-2 rounded-2xl bg-white border border-blue-100 p-3 shadow-sm"><span className="w-9 h-9 rounded-xl bg-blue-50 text-blue-700 font-extrabold flex items-center justify-center">{chapters.length}</span><span className="text-sm font-bold text-slate-600">chương học<br/><span className="text-slate-400 font-medium">{chapters.reduce((total, chapter) => total + chapter.lessons.length, 0)} bài học</span></span></div>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 md:gap-6">
          {chapters.map((chapter, chapterIndex) => {
            const theme = chapterThemes[chapterIndex % chapterThemes.length];
            return <article key={chapter.id} className={`group relative overflow-hidden bg-white border rounded-[1.65rem] p-5 md:p-6 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-lg ${theme.border} ${theme.hover}`}>
              <div className={`absolute -right-10 -top-10 h-36 w-36 rounded-full opacity-60 ${theme.soft}`}></div>
              <div className="relative">
                <header className="flex items-start gap-4">
                  <span className={`w-[3.25rem] h-[3.25rem] min-w-[3.25rem] rounded-2xl bg-gradient-to-br ${theme.gradient} text-white flex items-center justify-center text-xl font-extrabold shadow-md`}>{chapterIndex + 1}</span>
                  <div className="min-w-0 flex-1"><p className={`text-xs uppercase tracking-[0.14em] font-extrabold ${theme.text}`}>Chương {chapterIndex + 1}</p><h3 className="text-xl md:text-2xl font-extrabold text-slate-900 leading-snug mt-1">{chapter.title.replace(/^Chương \d+: /,'')}</h3></div>
                  <span className={`shrink-0 rounded-full px-3 py-1.5 text-sm font-extrabold ${theme.soft} ${theme.text}`}>{chapter.lessons.length} bài</span>
                </header>
                <div className="mt-5 h-1.5 rounded-full bg-slate-100 overflow-hidden"><div className={`h-full w-1/3 rounded-full ${theme.line}`}></div></div>
                <div className="mt-5"><div className="flex items-center justify-between mb-3"><p className="text-xs font-extrabold uppercase tracking-wider text-slate-500">Nội dung bài học</p><span className={`text-xs font-bold ${theme.text}`}>Mở bài →</span></div><div className="space-y-2.5">{chapter.lessons.map((lesson, idx) => <button key={lesson} onClick={() => { setSelectedHomeLesson(lesson); navigateToTab('vocab'); }} className={`w-full flex items-center gap-3 rounded-2xl border p-3 text-left transition-all ${selectedHomeLesson === lesson ? `${theme.soft} ${theme.border} shadow-sm` : 'border-slate-100 bg-white hover:bg-slate-50 hover:border-slate-200 hover:translate-x-0.5'}`}><span className={`w-9 h-9 rounded-xl flex items-center justify-center text-sm font-extrabold shrink-0 ${selectedHomeLesson === lesson ? `bg-gradient-to-br ${theme.gradient} text-white shadow-sm` : 'bg-slate-100 text-slate-600'}`}>{idx + 1}</span><span className="flex-1 font-semibold text-slate-700 leading-snug">{lesson}</span><span className={`text-lg ${selectedHomeLesson === lesson ? theme.text : 'text-slate-300'}`}>→</span></button>)}</div></div>
              </div>
            </article>;
          })}
        </div>
      </div>
    );
  };

  return (
    <div className="flex h-screen bg-[#eef6ff] font-sans text-gray-900 overflow-hidden">
      
      {/* SIDEBAR */}
      <div className={`bg-white border-r border-slate-200 flex flex-col justify-between transition-all duration-300 z-20 ${isSidebarOpen ? 'w-64' : 'w-20'}`}>
        <div>
          <div className="h-20 flex items-center justify-center border-b border-slate-100 shrink-0 cursor-pointer" onClick={() => navigateToTab('home')}>
            <BioLogo />
            {isSidebarOpen && <span className="ml-3 text-xl font-extrabold tracking-tight text-slate-900">BioBilingual</span>}
          </div>
          
          <div className="mt-2 flex flex-col gap-1.5 px-2">
            {[
              { id: 'home', icon: 'home', label: 'Trang chủ', english: 'Home', tone:'bg-blue-100 border-blue-200 text-blue-800 hover:border-blue-400', active:'bg-blue-600 border-blue-600' },
              { id: 'vocab', icon: 'vocab', label: 'Từ vựng', english: 'Vocabulary', tone:'bg-violet-100 border-violet-200 text-violet-800 hover:border-violet-400', active:'bg-violet-600 border-violet-600' },
              { id: 'materials', icon: 'materials', label: 'Học liệu', english: 'Materials', tone:'bg-sky-100 border-sky-200 text-sky-800 hover:border-sky-400', active:'bg-sky-600 border-sky-600' },
              { id: 'entertainment', icon: 'music', label: 'Giải trí', english: 'Entertainment', tone:'bg-fuchsia-100 border-fuchsia-200 text-fuchsia-800 hover:border-fuchsia-400', active:'bg-fuchsia-600 border-fuchsia-600' },
              { id: 'library', icon: 'exam', label: 'Luyện tập', english: 'Practice', tone:'bg-orange-100 border-orange-200 text-orange-800 hover:border-orange-400', active:'bg-orange-500 border-orange-500' },
              { id: 'ranking', icon: 'ranking', label: 'Bảng xếp hạng', english: 'Leaderboard', tone:'bg-emerald-100 border-emerald-200 text-emerald-800 hover:border-emerald-400', active:'bg-emerald-600 border-emerald-600' },
            ].map(item => (
              <button
                key={item.id} onClick={() => navigateToTab(item.id)} title={!isSidebarOpen ? `${item.label} / ${item.english}` : ""}
                className={`flex items-center border shadow-sm ${isSidebarOpen ? 'justify-start text-left px-2.5' : 'justify-center'} py-1.5 rounded-xl transition-all group ${activeTab === item.id ? `${item.active} text-white font-bold shadow-md` : `${item.tone} hover:-translate-y-0.5 hover:shadow-md`}`}
              >
                {isSidebarOpen ? (
                  <span className="inline-flex items-center gap-3 text-[18px] leading-tight w-full">
                    <span className="w-6 shrink-0 flex items-center justify-center"><NavIcon name={item.icon} active={activeTab === item.id} /></span>
                    <span className="text-left leading-tight"><span className="block text-[17px] font-extrabold">{item.label}</span><span className={`block text-[17px] font-semibold mt-0.5 ${activeTab === item.id ? 'text-white/80' : 'text-slate-500'}`}>{item.english}</span></span>
                  </span>
                ) : (
                  <NavIcon name={item.icon} active={activeTab === item.id} />
                )}
              </button>
            ))}

        <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="mt-2 w-full flex items-center justify-center p-1.5 rounded-xl border border-slate-200 text-slate-500 hover:bg-stone-50 transition-colors">
              <span className="font-bold">{isSidebarOpen ? '« Thu gọn' : '»'}</span>
            </button>
          </div>
        </div>

        <div className="p-4 border-t border-slate-100 bg-white">
          <button type="button" onClick={() => { setProfileDraft(studentProfile || emptyStudentProfile); setProfileOpen(true); }} className={`w-full flex items-center ${isSidebarOpen ? 'justify-between' : 'justify-center'} mb-4 rounded-xl p-1 -m-1 hover:bg-slate-50 transition-colors text-left`} title="Chỉnh sửa hồ sơ học sinh">
            <div className="flex items-center gap-3 overflow-hidden">
              <div className="w-10 h-10 shrink-0 bg-blue-100 text-blue-800 rounded-full flex items-center justify-center text-sm font-extrabold">{(studentProfile?.name || 'HS').trim().slice(0, 2).toUpperCase()}</div>
              {isSidebarOpen && (
                <div className="min-w-0">
                  <p className="font-bold text-gray-800 text-sm truncate">{studentProfile?.name || 'Học sinh mới'}</p>
                  <p className="text-xs text-gray-500 truncate">{studentProfile ? `${studentProfile.school} · ${studentProfile.className || `Khối ${studentProfile.block || studentProfile.grade}`}` : 'Hoàn tất hồ sơ'}</p>
                </div>
              )}
            </div>
          </button>
          
          <div className={`flex items-center ${isSidebarOpen ? 'justify-between' : 'justify-center flex-col gap-3'}`}>
            <div className="bg-stone-100 text-slate-600 px-3 py-2 rounded-xl flex items-center justify-center gap-2">
              <span className="w-2 h-2 rounded-full bg-blue-600"></span>
              {isSidebarOpen && <span className="font-extrabold text-sm">38.738 điểm</span>}
            </div>
            <button type="button" onClick={signOut} className={`text-gray-500 hover:text-red-600 p-2 rounded-xl hover:bg-white transition-colors ${isSidebarOpen ? 'flex items-center gap-2' : ''}`} title="Đăng xuất Google">
              <span className="text-sm">↪</span>
              {isSidebarOpen && <span className="text-sm font-medium">Đăng xuất</span>}
            </button>
          </div>
        </div>
      </div>

      {/* NỘI DUNG CHÍNH */}
      <main ref={mainRef} className="flex-1 overflow-y-auto relative bg-[#eef6ff]">
        <div className="h-20 px-5 md:px-10 flex items-center justify-between border-b border-blue-100 bg-white/85 backdrop-blur-sm sticky top-0 z-10">
          <div>{activeTab !== 'home' && <button onClick={() => window.dispatchEvent(new Event('bioedu-local-back'))} className="inline-flex items-center gap-2 text-sm font-semibold text-slate-500 hover:text-blue-700"><span aria-hidden="true" className="text-lg leading-none">←</span> Quay lại / Back</button>}</div>
          <div className="flex items-center gap-4"><button className="text-sm font-semibold text-slate-500 hover:text-slate-900">Trợ giúp / Help</button><span className="w-8 h-8 rounded-full border border-slate-200 bg-white text-slate-500 flex items-center justify-center text-sm">?</span></div>
        </div>
        
        {/* Header Tabs */}
        {activeTab !== 'home' && (
           <div className="px-5 md:px-10 pt-9 mb-2">
             <h2 className="text-3xl md:text-4xl font-extrabold flex items-center gap-4 text-blue-900">
               {activeTab === 'vocab' && <>Từ vựng</>}
               {activeTab === 'materials' && <>Học liệu</>}
               {activeTab === 'entertainment' && <>Giải trí</>}
               {activeTab === 'library' && <>Luyện tập</>}
               {activeTab === 'ranking' && <>Bảng Xếp Hạng</>}
             </h2>
          </div>
        )}

        {activeTab === 'home' && renderHome()}
        {activeTab === 'vocab' && <VocabSystem initialGrade={selectedHomeGrade} selectedPath={findLessonContext(selectedHomeLesson)} onPathChange={(context) => { if (context) { setSelectedHomeGrade(context.grade); setSelectedHomeLesson(context.lesson); } }} />}
        {activeTab === 'materials' && <MaterialsTab />}
        {activeTab === 'entertainment' && <EntertainmentTab />}
        {activeTab === 'library' && <QuestionBankTab />}
        
        {activeTab === 'ranking' && <LeaderboardTab />}

        {/* Floating Chatbot Widget */}
        <button className="fixed bottom-7 right-7 bg-blue-600 text-white px-4 h-11 rounded-full shadow-lg shadow-blue-200 flex items-center justify-center text-sm font-bold hover:bg-blue-700 transition-colors z-50 cursor-pointer">
          Hỏi Biola / Ask Biola
        </button>
      </main>

      {(authChecking || !googleAuth) && (
        <div className="fixed inset-0 z-[200] flex items-center justify-center overflow-y-auto bg-gradient-to-br from-blue-950/80 via-slate-900/75 to-emerald-950/75 p-4 backdrop-blur-md">
          <div className="relative w-full max-w-md overflow-hidden rounded-[2rem] border border-white/70 bg-white p-7 text-center shadow-2xl md:p-10">
            <div className="absolute -right-20 -top-20 h-52 w-52 rounded-full bg-blue-100"></div>
            <div className="absolute -bottom-24 -left-20 h-56 w-56 rounded-full bg-emerald-100"></div>
            <div className="relative">
              <div className="mx-auto flex w-fit items-center gap-3"><BioLogo/><span className="text-2xl font-extrabold tracking-tight text-slate-900">BioBilingual</span></div>
              <div className="mx-auto mt-7 flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-50 text-3xl shadow-sm">🧬</div>
              <p className="mt-6 text-xs font-extrabold uppercase tracking-[0.2em] text-blue-600">Khu vực học sinh</p>
              <h1 className="mt-2 text-3xl font-extrabold leading-tight text-slate-950">Đăng nhập để bắt đầu học</h1>
              <p className="mx-auto mt-3 max-w-sm text-sm font-medium leading-6 text-slate-500">Dùng tài khoản Google để lưu hồ sơ, kết quả học tập và bảng xếp hạng chính xác.</p>
              <div className="mt-7 flex min-h-[44px] justify-center">
                {authChecking ? <div className="flex items-center gap-3 rounded-full bg-slate-100 px-5 py-3 text-sm font-bold text-slate-600"><span className="h-4 w-4 animate-spin rounded-full border-2 border-blue-600 border-t-transparent"></span>Đang kiểm tra đăng nhập...</div> : <div ref={googleButtonRef}></div>}
              </div>
              {authError && <p className="mt-4 rounded-xl bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">{authError}</p>}
              <p className="mt-6 text-xs leading-5 text-slate-400">Sau lần đăng nhập đầu tiên, bạn sẽ điền họ tên, trường, khối và lớp.</p>
            </div>
          </div>
        </div>
      )}

      {profileOpen && (
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/55 p-4">
          <div className="w-full max-w-lg rounded-[1.75rem] bg-white p-6 md:p-8 shadow-2xl border border-white/70">
            <div className="flex items-start gap-4">
              <div className="w-12 h-12 rounded-2xl bg-blue-100 text-blue-700 flex items-center justify-center text-2xl shrink-0">👋</div>
              <div>
                <p className="text-xs font-extrabold uppercase tracking-[0.18em] text-blue-600">Chào mừng đến BioBilingual</p>
                <h2 className="mt-1 text-2xl font-extrabold text-slate-900">Hoàn tất hồ sơ học sinh</h2>
                <p className="mt-2 text-sm leading-relaxed text-slate-500">Điền thông tin để cá nhân hóa lộ trình học tập của bạn.</p>
              </div>
            </div>

            <div className="mt-6 space-y-4">
              <label className="block">
                <span className="mb-1.5 block text-sm font-extrabold text-slate-700">Họ và tên</span>
                <input value={profileDraft.name} onChange={e => setProfileDraft(d => ({ ...d, name: e.target.value }))} placeholder="Nguyễn Văn An" autoFocus className="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100" />
              </label>
              <label className="block">
                <span className="mb-1.5 block text-sm font-extrabold text-slate-700">Gmail đăng nhập Google</span>
                <input type="email" value={googleAuth?.user?.email || profileDraft.email || ''} readOnly className="w-full cursor-not-allowed rounded-xl border border-slate-200 bg-slate-100 px-4 py-3 font-semibold text-slate-600 outline-none" />
                <span className="mt-1.5 block text-xs text-emerald-700">Đã xác minh bởi Google</span>
              </label>
              <label className="block">
                <span className="mb-1.5 block text-sm font-extrabold text-slate-700">Trường</span>
                <input value={profileDraft.school} onChange={e => setProfileDraft(d => ({ ...d, school: e.target.value }))} placeholder="THPT ..." className="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100" />
              </label>
              <label className="block">
                <span className="mb-1.5 block text-sm font-extrabold text-slate-700">Khối</span>
                <select value={profileDraft.block || ''} onChange={e => setProfileDraft(d => ({ ...d, block: e.target.value, className: '' }))} className="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                  <option value="">Chọn khối</option><option value="10">Khối 10</option><option value="11">Khối 11</option><option value="12">Khối 12</option>
                </select>
              </label>
              <label className="block">
                <span className="mb-1.5 block text-sm font-extrabold text-slate-700">Lớp</span>
                <select value={profileDraft.className || ''} onChange={e => setProfileDraft(d => ({ ...d, className: e.target.value }))} disabled={!profileDraft.block} className="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100 disabled:cursor-not-allowed disabled:opacity-60">
                  <option value="">{profileDraft.block ? 'Chọn lớp' : 'Chọn khối trước'}</option>{classOptions.map(className => <option key={className} value={`${profileDraft.block} ${className}`}>{profileDraft.block} {className}</option>)}
                </select>
              </label>
            </div>

            {authError && <p className="mt-5 rounded-xl bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">{authError}</p>}
            <button type="button" onClick={saveStudentProfile} disabled={profileSaving || !profileDraft.name.trim() || !googleAuth?.user?.email || !profileDraft.school.trim() || !profileDraft.block || !profileDraft.className} className="mt-7 w-full rounded-xl bg-blue-600 px-4 py-3.5 text-sm font-extrabold text-white shadow-lg shadow-blue-200 transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-slate-300 disabled:shadow-none">{profileSaving ? 'Đang lưu...' : 'Lưu hồ sơ / Continue'}</button>
          </div>
        </div>
      )}

      {/* Global CSS để tạo hiệu ứng và ẩn thanh cuộn */}
      <style>{`
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      `}</style>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
