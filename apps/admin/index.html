<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BioBilingual Admin</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f8fafc;color:#334155;min-height:100vh;display:grid;place-items:center}#boot{font-weight:700}</style>
</head>
<body>
<div id="boot">Đang tải BioBilingual Admin…</div>
<script>
(async()=>{
  try{
    const url='https://raw.githubusercontent.com/biobilingual/sinh-hoc-hoc-duong/07eb9f4625a8ef43bb6733bd97c78660686c8c73/apps/admin/index.html';
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw new Error('Không tải được giao diện Admin.');
    let html=await res.text();
    html=html.replace('</body>','<script src="./student-reset.js"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    const el=document.getElementById('boot');
    el.textContent='Không thể tải Admin: '+(err?.message||err);
    el.style.color='#be123c';
  }
})();
</script>
</body>
</html>
